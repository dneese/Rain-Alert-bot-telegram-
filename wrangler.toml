name = "weather-bots"
compatibility_flags = ["nodejs_compat"]

[vars]
  TELEGRAM_BOT_TOKEN = ""       # rain-bot token (set via: wrangler secret put TELEGRAM_BOT_TOKEN)
  BOT_TOKEN = ""                # pogoda bot token 8883331647:... (set via: wrangler secret put BOT_TOKEN)
  SUPABASE_ANON_KEY = ""                # set via env / secret (never commit a real key)
  WEBHOOK_BASE = ""             # public base URL for webhook setups (e.g. https://weather-bots.xyz)
  CHECK_CRON = "*/15 * * * *"   # every 15 minutes
  RADAR_CACHE_TTL_MS = "3600000" # 1 hour radar cache
  SUPABASE_SERVICE_ROLE = ""     # set via: wrangler secret put SUPABASE_SERVICE_ROLE (never commit)