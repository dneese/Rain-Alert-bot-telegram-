name = "rain-alert-bot"
main = "src/rain-only.js"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[vars]
  SUPABASE_URL = "https://ljavyrmgcepwximavjyz.supabase.co"
  WEATHERAPI_KEY = ""
  OWM_KEY = ""
  RAINBOW_KEY = ""

# Secrets (set via: wrangler secret put TELEGRAM_BOT_TOKEN, wrangler secret put SUPABASE_SERVICE_ROLE)
# TELEGRAM_BOT_TOKEN — rain bot token
# SUPABASE_SERVICE_ROLE — Supabase service role key (never commit it)